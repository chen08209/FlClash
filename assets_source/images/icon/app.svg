      <use xlink:href="#glyph" fill="black" transform="translate(.35 .9)" filter="url(#hiblur)" />
    </mask>
    <g id="art">
      <use xlink:href="#glyph" fill="url(#shade)" transform="translate(0 4.2)" filter="url(#drop)" opacity=".2" />
      <use xlink:href="#glyph" fill="url(#face)" />
