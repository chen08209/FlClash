    </linearGradient>
    <linearGradient id="shade" x1="59" y1="130" x2="191" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c3588" />
      <stop offset="0.25" stop-color="#5e3886" />
      <stop offset="0.5" stop-color="#723978" />
      <stop offset="0.75" stop-color="#8a4660" />
      <stop offset="1" stop-color="#96604a" />
    </linearGradient>
    <filter id="drop" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>
    <filter id="core" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="erode" radius="1" />
