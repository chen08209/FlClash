216 |   changelog:
217 |     if: ${{ !contains(github.ref, '-') }}
218 |     permissions:
219 |       contents: write
220 |     runs-on: ubuntu-latest
221 |     needs: [ build ]
222 |     steps:
223 |       - name: Checkout
224 |         uses: actions/checkout@v4
225 |         with:
226 |           fetch-depth: 0
227 |           ref: refs/heads/main
228 |       - name: Generate
229 |         run: |
230 |           last_ver=$(grep -m1 '^## ' CHANGELOG.md 2>/dev/null | sed 's/^## //')
231 | 
232 |           mapfile -t tags < <(git tag --merged HEAD --sort=-creatordate)
233 | 
234 |           temp="NEW_CHANGELOG.md"
235 |           : > "$temp"
236 | 
237 |           for i in "${!tags[@]}"; do
238 |               curr="${tags[i]}"
239 |               [[ "$curr" == "$last_ver" ]] && break
240 | 
241 |               prev="${tags[i+1]}"
242 |               range="${prev:+$prev..}$curr"
243 | 
244 |               echo -e "## $curr\n" >> "$temp"
245 |               git log --no-merges --pretty=format:"%B" "$range" | \
246 |               awk '!/Update changelog/ && NF {print "- " $0 "\n"}' >> "$temp"
247 |           done
248 |           [ -f CHANGELOG.md ] && cat CHANGELOG.md >> "$temp"
249 |           
250 |           mv "$temp" CHANGELOG.md
251 | 
252 |       - name: Commit
253 |         run: |
254 |           git add CHANGELOG.md
255 |           if ! git diff --cached --quiet; then
256 |             echo "Commit pushing"
257 |             git config --local user.email "chen08209@gmail.com"
258 |             git config --local user.name "chen08209"
259 |             git commit -m "Update changelog"
260 |             if git push; then
261 |               echo "Push succeeded"
262 |             else
263 |               echo "Push failed"
264 |               exit 1
265 |             fi
266 |           fi
