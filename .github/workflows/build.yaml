name: Build Linux .deb

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux-deb:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 180

    steps:
      - name: Install base tools and configure locale
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export TZ=Etc/UTC
          ln -snf /usr/share/zoneinfo/Etc/UTC /etc/localtime && echo "Etc/UTC" > /etc/timezone
          apt-get update -y
          apt-get install -y \
            software-properties-common \
            apt-transport-https \
            ca-certificates \
            gnupg \
            curl \
            wget \
            git \
            jq \
            unzip \
            xz-utils \
            zip \
            ninja-build \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libkeybinder-3.0-dev \
            locate \
            rpm \
            patchelf \
            libfuse2 \
            build-essential \
            cmake \
            pkg-config \
            clang

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: core/go.sum

      - name: Setup Rust (system-wide)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export RUSTUP_HOME=/opt/rust
          export CARGO_HOME=/opt/rust
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          ln -sf /opt/rust/bin/rustup /usr/local/bin/rustup
          ln -sf /opt/rust/bin/cargo /usr/local/bin/cargo
          ln -sf /opt/rust/bin/rustc /usr/local/bin/rustc
          ln -sf /opt/rust/bin/rust-gdb /usr/local/bin/rust-gdb 2>/dev/null || true
          ln -sf /opt/rust/bin/rust-lldb /usr/local/bin/rust-lldb 2>/dev/null || true
          for bin in /opt/rust/bin/*; do
            name=$(basename "$bin")
            if [ ! -e "/usr/local/bin/$name" ]; then
              ln -sf "$bin" "/usr/local/bin/$name" 2>/dev/null || true
            fi
          done
          echo "RUSTUP_HOME=$RUSTUP_HOME"
          echo "CARGO_HOME=$CARGO_HOME"
          rustup --version
          cargo --version
          rustc --version
        env:
          RUSTUP_HOME: /opt/rust
          CARGO_HOME: /opt/rust

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Activate flutter_distributor
        run: |
          dart pub global activate -s path plugins/flutter_distributor/packages/flutter_distributor

      - name: Build Linux .deb package
        run: |
          export RUSTUP_HOME=/opt/rust
          export CARGO_HOME=/opt/rust
          export PATH="/opt/rust/bin:$PATH"
          dart setup.dart linux --targets deb --env pre
        env:
          GOFLAGS: -buildvcs=false
          RUSTUP_HOME: /opt/rust
          CARGO_HOME: /opt/rust

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-linux-amd64-deb
          path: dist/**/**/*.deb
          if-no-files-found: error

      - name: List build output
        run: find dist -type f -name "*.deb" 2>/dev/null || echo "No .deb files found in dist/"
