name: 功能请求 / Feature request
description: 提出 FlClash 还没有的功能 / Ask for something FlClash does not do yet
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先在最新版里找一下，很多功能在“工具 → 进阶配置”里。一个 issue 只提一个功能。/ Look in the latest release first; many features are under "Tools → Advanced configuration". One feature per issue.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: >-
        你在做什么、现在卡在哪一步、现在怎么绕过。写问题，不要只写“加个按钮”。/
        What you are doing, where it gets in the way and how you work around it today. Describe the problem, not just
        "add a button".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为 / Proposed behavior
      description: 加上之后，你会在哪个页面怎么操作、看到什么。/ With the feature, which page you would use, what you would do and what you would see.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 别的客户端的做法 / In other clients
      description: 可选。已有客户端这样做的，写名字并附链接或截图。/ Optional. A client that already does this, with a link or screenshot.
  - type: dropdown
    id: platforms
    attributes:
      label: 适用平台 / Platforms
      multiple: true
      options:
        - Android
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checks
      options:
        - label: 我在最新版里找过，没有这个功能。/ I looked in the latest release and it does not have this.
          required: true
        - label: 我搜索过已有 issue（包括已关闭的），没有相同的请求。/ I searched the existing issues, open and closed, and found no same request.
          required: true
        - label: 这个 issue 只提一个功能。/ This issue asks for one feature.
          required: true
