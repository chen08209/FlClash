name: fl_clash
description: A multi-platform proxy client based on the Concord core, simple and easy to use, open-source and ad-free.
publish_to: 'none'
version: 0.9.4+2026110401
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.50.0'

hooks:
  user_defines:
    setup:
      build_assets: true
    rust_api:
      build_assets: true

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  shared_preferences_platform_interface: ^2.4.2
  json_annotation: ^4.12.0
  file_picker: ^13.3.3
  mobile_scanner: ^7.4.2
  collection: ^1.19.1
  clock: ^1.1.3
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.4
  ffi: ^2.2.0

  dio: ^5.11.1
  code_forge:
    path: plugins/code_forge
  re_highlight: ^0.0.3
  archive: ^4.3.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  path_parsing: ^1.1.0
  flutter_cache_manager: ^3.4.5
  crypto: ^3.0.7
  yaml: ^3.1.4
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  rust_api:
    path: plugins/rust_api
  dynamic_color:
    path: plugins/dynamic_color
  prism_ui:
    path: plugins/prism_ui
  setup:
    path: plugins/setup
dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: ^13.3.0
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.16.1
  args: ^2.7.0
  freezed: ^4.0.1
  riverpod_generator: ^4.0.9

  drift_dev: ^2.35.1
  test: ^1.32.0
  sqlite3: ^3.7.0
  cross_file: ^0.3.5+5
  mocktail: ^1.0.5

flutter:
  generate: true
  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/
    - assets/images/avatar/
    - assets/images/services/
    - concord/assets/ca-certificates.crt
    - path: assets/images/tray/unix/
      platforms: [ linux, macos ]
    - path: assets/images/tray/macos/
      platforms: [ macos ]
    - path: assets/images/tray/windows/
      platforms: [ windows ]
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
