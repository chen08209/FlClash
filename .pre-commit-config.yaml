repos:
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        files: \.dart$
        stages: [pre-commit]
      - id: comment-density
        name: comment density
        entry: tool/hooks/comment_density.sh
        language: system
        files: \.(dart|kt|kts|swift|go|rs|java|cpp|cc|h|hpp|gradle|ya?ml)$
        stages: [pre-commit]
      - id: commit-msg-format
        name: conventional commit message
        entry: tool/hooks/commit_msg.sh
        language: system
        stages: [commit-msg]
