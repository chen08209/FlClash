name: window
description: Desktop window control for FlClash on Linux, macOS and Windows.
version: 0.0.1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  screen_retriever: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: WindowPlugin
      macos:
        pluginClass: WindowPlugin
      windows:
        pluginClass: WindowPluginCApi
